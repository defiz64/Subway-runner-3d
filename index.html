<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subway Runner 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{--bg:#1e293b;--fg:#fff;--gold:#fbbf24;--card:rgba(15,23,42,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a}}
:root[data-theme="dark"]{--bg:#0f172a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Lilita One","Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;letter-spacing:.3px}
body{position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none}
.gem{display:inline-block;width:15px;height:17px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);vertical-align:-2px}
.gem.b{background:linear-gradient(135deg,#bfdbfe,#2563eb)}.gem.r{background:linear-gradient(135deg,#fecaca,#dc2626)}
#hud{inset:10px 14px auto;justify-content:space-between;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none;height:36px}
#hud b{color:var(--gold)}
#warn{inset:50px 0 auto;justify-content:center;font-size:24px;color:#fecaca;text-shadow:0 2px 0 #7f1d1d;pointer-events:none;height:34px}
#menu{flex-direction:column;justify-content:space-between;padding:14px;box-sizing:border-box;pointer-events:none}
#menu>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ic{display:grid;grid-template-columns:repeat(3,66px);gap:10px}
.sq{position:relative;width:66px;height:66px;border:2px solid rgba(255,255,255,.45);border-radius:18px;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;background:linear-gradient(var(--g1),var(--g2));box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.4);text-shadow:0 1px 0 rgba(0,0,0,.5);transition:transform .12s}
.sq:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.4)}
.sq i{font-style:normal;font-size:28px;line-height:30px}.sq small{font-size:12px}
.o{--g1:#fdba74;--g2:#ea580c}.g{--g1:#86efac;--g2:#16a34a}.p{--g1:#d8b4fe;--g2:#7e22ce}.y2{--g1:#fde68a;--g2:#d97706}.c{--g1:#a5f3fc;--g2:#0891b2}
.bd{position:absolute;top:-7px;right:-7px;background:#ef4444;border:2px solid #fff;border-radius:999px;font-size:13px;min-width:20px;height:20px;line-height:20px;text-align:center}
.cnt{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{background:var(--card);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 16px;font-size:22px;display:flex;gap:8px;align-items:center}
.logo{position:absolute;left:0;right:0;top:152px;text-align:center;font-size:44px;line-height:.95;color:#fde047;text-shadow:0 4px 0 #b45309,0 8px 18px rgba(0,0,0,.5);pointer-events:none}
button.y{font:inherit;color:#1e293b;border:0;border-radius:18px;background:linear-gradient(#fde047,#f59e0b);box-shadow:0 6px 0 #b45309,inset 0 3px 0 rgba(255,255,255,.55);cursor:pointer}
button.y:active{transform:translateY(4px);box-shadow:0 2px 0 #b45309}
button.y:disabled{opacity:.5;filter:grayscale(.7);box-shadow:none}
.big{align-self:center;width:min(86%,380px);height:84px;font-size:40px;margin-bottom:12px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.04)}}
#over,#pn,#ch{align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
#pn,#ch{background:rgba(0,0,0,.6)}
.card{background:var(--card);border:2px solid rgba(255,255,255,.18);border-radius:24px;padding:20px;width:min(100%,380px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:86vh;overflow:auto;touch-action:pan-y;box-sizing:border-box}
h1{margin:0 0 8px;font-size:30px;font-weight:400}
p{margin:6px 0;font-size:18px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14);text-align:left;font-size:18px}
.d{font-size:14px;opacity:.8}
button.s{font-size:16px;padding:8px 12px;margin:2px 0 2px 4px;border-radius:12px;box-shadow:0 3px 0 #b45309;white-space:nowrap}
.card .y.m{font-size:22px;padding:10px 24px;margin:12px 4px 0}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}.seg .s{margin:0}
.seg .s.on{background:linear-gradient(#86efac,#16a34a);box-shadow:0 3px 0 #166534}
.mc{border-radius:16px;overflow:hidden;margin:10px 0;border:3px solid transparent;background:rgba(255,255,255,.07);text-align:left}
.mc.sel{border-color:var(--gold)}.mc img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.mi{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:18px}
.chest{position:relative;width:150px;height:120px;margin:22px auto 16px}
.chb{position:absolute;bottom:0;left:0;right:0;height:66px;border-radius:6px 6px 12px 12px;background:repeating-linear-gradient(90deg,#a16207 0 18px,#8a5206 18px 20px);border:3px solid #451a03;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.chb:after{content:'';position:absolute;left:50%;top:-5px;width:24px;height:32px;margin-left:-12px;background:linear-gradient(#fde047,#d97706);border-radius:5px;border:2px solid #78350f}
.chl{position:absolute;bottom:60px;left:-4px;right:-4px;height:46px;border-radius:60px 60px 4px 4px/44px 44px 4px 4px;background:linear-gradient(#ca8a04,#92400e);border:3px solid #451a03;transform-origin:0 100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.glow{position:absolute;left:50%;bottom:56px;width:10px;height:10px;border-radius:50%;background:#fff7ae;box-shadow:0 0 70px 46px rgba(253,224,71,.85);opacity:0;transition:opacity .4s}
.chest.sh{animation:shk .12s linear 8}.chest.op .chl{transform:rotate(-108deg)}.chest.op .glow{opacity:1}
@keyframes shk{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
.rw{font-size:32px;min-height:44px;opacity:0;transform:scale(.3);transition:.5s cubic-bezier(.3,1.8,.5,1)}.rw.on{opacity:1;transform:none}
body:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.34))}
.al{position:absolute;right:16px;bottom:30px;width:78px;height:78px;border-radius:50%;font:inherit;font-size:36px;border:3px solid #fff;background:linear-gradient(#7dd3fc,#1d4ed8);box-shadow:0 6px 0 #1e3a8a,inset 0 3px 0 rgba(255,255,255,.5);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:5}
.al:active{transform:translateY(4px);box-shadow:0 2px 0 #1e3a8a}
.al b{position:absolute;top:-6px;right:-6px;background:#ef4444;border:2px solid #fff;border-radius:999px;font-size:15px;font-weight:400;min-width:24px;height:24px;line-height:24px}
</style>
</head>

<canvas id="c"></canvas>
<div id="hud" class="scr"><div>Счёт <b id="sc">0</b> · <b id="ds">0</b> м</div><div><i class="gem b"></i> <b id="hb">0</b> &nbsp; <i class="gem r"></i> <b id="hr">0</b></div></div>

  <div class="logo">SUBWAY<br>RUNNER</div>

</div>

<div id="pn" class="scr"><div class="card"><h1 id="pt"></h1><div id="pb"></div><button class="y m" id="px">Закрыть</button></div></div>

  <div class="chest" id="cx"><div class="glow"></div><div class="chb"></div><div class="chl"></div></div>
  <div id="odds"></div><div class="rw" id="crw"></div>
  <div id="cbtn"><button class="y m" id="cinv">В инвентарь</button><button class="y m" id="copen">Открыть</button></div>
  <button class="y m" id="cdone" style="display:none">Продолжить</button></div></div>

<script>
(function(){

function apply(sv){if(sv)for(var k in sv)D[k]=sv[k]}
try{apply(JSON.parse(localStorage.getItem('sr2')||'null'))}catch(e){}

function cloudInit(){
  if(!window.claude||!claude.use)return;

      if(!id)return;

      return ref.get().then(function(s){
        if(s.exists){apply(JSON.parse(JSON.stringify(s.data())));try{localStorage.setItem('sr2',JSON.stringify(D))}catch(e){}if(state==='menu'){buildWorld();toMenu()}else cnt();cdoc=ref}
        else{cdoc=ref;save()}
      })})}).catch(function(){})}
function show(id,on){$(id).style.display=on?'flex':'none'}

var mats={};function mat(c){return mats[c]||(mats[c]=new T.MeshStandardMaterial({color:c,roughness:.55,metalness:.08}))}

function bx(w,h,d,c){return M(new T.BoxGeometry(w,h,d),c)}

/* Текстуры */
function tex(w,h,f,rx,ry){var c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=4;return t}
function noise(g,w,h,n,f){for(var i=0;i<n;i++){g.fillStyle=f(Math.random());g.fillRect(Math.random()*w,Math.random()*h,2,2)}}
function TM(t){return new T.MeshStandardMaterial({map:t,roughness:.72,metalness:.04})}
var tAsph=tex(128,128,function(g,w,h){g.fillStyle='#4b5563';g.fillRect(0,0,w,h);noise(g,w,h,1100,function(r){return r<.5?'rgba(0,0,0,.28)':'rgba(255,255,255,.12)'})});
function grassTex(c){return tex(128,128,function(g,w,h){g.fillStyle=c;g.fillRect(0,0,w,h);noise(g,w,h,900,function(r){return r<.5?'rgba(0,0,0,.14)':'rgba(255,255,255,.16)'})})}
var wm={},cm={},trM={};
function winMat(c){return wm[c]||(wm[c]=TM(tex(128,256,function(g,w,h){g.fillStyle=c;g.fillRect(0,0,w,h);for(var y=12;y<h-10;y+=32)for(var x=10;x<w-10;x+=30){g.fillStyle=Math.random()<.45?'#fde68a':'#1e3a5f';g.fillRect(x,y,18,20);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,18,4)}})))}
function cotMat(c){return cm[c]||(cm[c]=TM(tex(128,96,function(g,w,h){g.fillStyle=c;g.fillRect(0,0,w,h);g.fillStyle='#78350f';g.fillRect(52,40,24,56);g.fillStyle='#7dd3fc';g.fillRect(12,28,28,28);g.fillRect(88,28,28,28);g.fillStyle='#fff';g.fillRect(25,28,2,28);g.fillRect(101,28,2,28)})))}
function trainTex(c){return tex(256,96,function(g,w,h){g.fillStyle=c;g.fillRect(0,0,w,h);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,h-16,w,16);g.fillStyle='#f8fafc';g.fillRect(0,h*.64,w,6);for(var x=14;x<w-30;x+=48){g.fillStyle='#0f172a';g.fillRect(x-2,10,38,34);g.fillStyle='#7dd3fc';g.fillRect(x,12,34,30);g.fillStyle='rgba(255,255,255,.45)';g.fillRect(x,12,34,8)}})}
function frontTex(c){return tex(128,192,function(g,w,h){g.fillStyle=c;g.fillRect(0,0,w,h);g.fillStyle='#0b1220';g.fillRect(14,14,100,70);g.fillStyle='#7dd3fc';g.fillRect(18,18,92,60);g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.moveTo(18,18);g.lineTo(60,18);g.lineTo(18,60);g.fill();g.fillStyle='#fef08a';g.beginPath();g.arc(30,138,11,0,7);g.fill();g.beginPath();g.arc(98,138,11,0,7);g.fill();g.fillStyle='#111827';g.fillRect(0,166,w,26);g.fillStyle='#fff';g.fillRect(40,100,48,16)})}
function hazTex(a,b){return tex(128,32,function(g,w,h){g.fillStyle=a;g.fillRect(0,0,w,h);g.fillStyle=b;for(var x=-h;x<w+h;x+=32){g.beginPath();g.moveTo(x,h);g.lineTo(x+16,h);g.lineTo(x+16+h,0);g.lineTo(x+h,0);g.fill()}})}
var mHaz=TM(hazTex('#facc15','#111827')),mHaz2=TM(hazTex('#f8fafc','#dc2626')),mRamp=TM(hazTex('#38bdf8','#0c4a6e'));
function trainMat(c){return trM[c]||(trM[c]=(function(){var s='#'+('00000'+c.toString(16)).slice(-6),m=TM(trainTex(s));return [m,m,mat(0xe2e8f0),mat(0x1f2937),TM(frontTex(s)),mat(c)]})())}

/* Сезоны, погода, карты */
var SEA=[{n:'Лето',e:'☀️',sky:0x7dd3fc,gr:'#4ade80',tr:[0x16a34a,0x22c55e,0x15803d]},{n:'Осень',e:'🍂',sky:0xfdba74,gr:'#a3a33a',tr:[0xea580c,0xdc2626,0xca8a04]},{n:'Зима',e:'❄️',sky:0xcbd5e1,gr:'#f1f5f9',tr:[0xf8fafc,0xe2e8f0]},{n:'Весна',e:'🌸',sky:0xbae6fd,gr:'#86efac',tr:[0xf9a8d4,0xfbcfe8,0x86efac]}];
var WE=[{n:'Ясно',e:'🌤️'},{n:'Дождь',e:'🌧️'},{n:'Снег',e:'🌨️'},{n:'Туман',e:'🌫️'}];
var MAPS=[{n:'Городская линия',nl:3,t:'город'},{n:'Закатная магистраль',nl:5,t:'сельская местность'}];
var world=G();S.add(world);var sleepers=[],deco=[];
var BC=['#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#f472b6'];
function mkTree(){var g=G(),c=pick(SEA[D.se].tr);add(g,cyl(.16,.26,1.8,0x78350f,8),0,.9,0);
  if(D.map===1&&Math.random()<.5){var pc=D.se===2?0xf1f5f9:0x166534;for(var i=0;i<3;i++)add(g,M(new T.ConeGeometry(1.3-i*.3,1.7,8),pc),0,1.9+i*.9,0)}
  else{add(g,M(new T.IcosahedronGeometry(1.3,1),c),0,2.8,0);add(g,M(new T.IcosahedronGeometry(.9,1),c),.7,3.5,.3)}return g}

function mkCar(){var g=G(),c=pick([0xdc2626,0x2563eb,0xf8fafc,0xfacc15,0x111827]);add(g,bx(1.8,.55,3.8,c),0,.65,0);add(g,bx(1.5,.5,1.9,0x93c5fd),0,1.15,-.1);
  [[-1,-1.2],[1,-1.2],[-1,1.2],[1,1.2]].forEach(function(p){var w=cyl(.36,.36,.25,0x111827,12);w.rotation.z=Math.PI/2;add(g,w,p[0]*.9,.36,p[1])});return g}
function mkBill(){var g=G(),t=tex(256,128,function(c,w,h){c.fillStyle=pick(['#dc2626','#2563eb','#16a34a','#7c3aed']);c.fillRect(0,0,w,h);c.fillStyle='#fff';c.font='bold 44px sans-serif';c.textAlign='center';c.fillText(pick(['PIZZA','CITY BANK','РАДИО','КОФЕ']),w/2,78)});
  add(g,cyl(.1,.1,5,0x475569,8),0,2.5,0);add(g,bx(4,2,.2,TM(t)),0,5.3,0);return g}

    if(p.t<3)msg='⚠ Самолёт! Огонь через '+Math.ceil(3-p.t);else if(fire)msg='ОГОНЬ! Уйдите с красной полосы';
    if(fire){p.bt-=dt;if(p.bt<=0){p.bt=.09;var b=new T.Mesh(gBul,mBul),tx=lx(p.l)+(Math.random()-.5)*.8;
      b.userData={u:0,x0:lx(p.l),tx:tx,l:p.l};b.position.set(lx(p.l),7,-22);S.add(b);bullets.push(b)}}
    if(p.t>6.3){S.remove(p.g);S.remove(p.st);planes.splice(i,1)}}
  for(i=bullets.length-1;i>=0;i--){var bl=bullets[i],u=bl.userData;u.u+=dt/.5;
    bl.position.set(u.x0+(u.tx-u.x0)*u.u,7-6.5*u.u,-22+22.5*u.u);
    if(u.u>=1){S.remove(bl);bullets.splice(i,1);if(Math.abs(P.position.x-lx(u.l))<.8){hit();if(state!=='play')return}}}
  $('warn').textContent=msg;show('warn',!!msg)}

function hit(){if(inv>0||jet>0)return;if(ride>0){endRide();inv=.6;return}if(dsh){dsh=false;shM.visible=shield;inv=.6;return}if(lzS>0){lzS--;inv=.6;return}if(pgAct.length){killPeng();inv=.6;return}if(shield){shield=false;shM.visible=false;inv=1.5;return}die()}
function die(){
  state='over';P.visible=true;show('warn',0);show('hud',0);show('ally',0);
  var s=Math.floor(dist/10)+runB*5+runR*50;if(!trial){D.tm+=Math.floor(dist);qEv('dist',dist);qEv('run',1);save()}if(mx){rkDie(s);return}if(s>D.best&&!trial)D.best=s;save();show('abil',0);
  $('ot').innerHTML='Счёт: <b>'+s+'</b> · '+Math.floor(dist)+' м<br>Рекорд: <b>'+D.best+'</b><br>'+gem('b')+' '+runB+' &nbsp; '+gem('r')+' '+runR;if(trial)$('ot').innerHTML='<b>Пробный забег</b><br>'+Math.floor(dist)+' м<br><span class="d">Алмазы и рекорд не засчитываются</span>';show('over',1)}

function step(dt){
  time+=dt;speed=Math.min(32,15+time*.35);var d=speed*dt;dist+=d;scroll(d);
  if(dist>=(chN+1)*1000){chN++;if(!trial){if(cc()===1&&Math.random()<.5){D.r+=5;runR+=5;save();toast('🦄 Берри: +5 '+gem('r'))}if(!mx){state='chest';showChest('play');return}}}
  lastRow+=d;if(lastRow>-110){seeded(function(){lastRow-=22+Math.random()*8;spawnRow(lastRow)})}
  P.position.x+=(lx(lane)-P.position.x)*Math.min(1,dt*14);
  var gh=0,pp=py;for(var q0=0;q0<obs.length;q0++){var o0=obs[q0];if(o0.u.y1>2.4&&Math.abs(o0.position.x-P.position.x)<.95&&Math.abs(o0.position.z)<3.9){gh=2.5;break}}
  onTr=false;
  if(py>0||vy>0){vy-=(fl?fg:30)*dt;py+=vy*dt;if(gh&&vy<=0&&pp>=gh-.02&&py<=gh){py=gh+.001;vy=0;fl=false;onTr=true}else if(py<=0){py=0;vy=0;fl=false}}
  if(slideT>0)slideT-=dt;
  if(jet>0){jet-=dt;py=3.6+Math.sin(time*6)*.25;vy=0;fl=false;P.rotation.x=-.5;if(jet<=0){inv=1;P.rotation.x=0}}
  var sl=slideT>0;P.scale.y=sl?.5:1;P.position.y=py;
  var sw=Math.sin(time*14)*(py>0?.25:.9);lL.rotation.x=sw;lR.rotation.x=-sw;aL.rotation.x=-sw;aR.rotation.x=sw;
  if(inv>0){inv-=dt;P.visible=inv<=0||Math.floor(time*20)%2===0}
  var ph=sl?.9:1.9,i;updAllyFx(dt);
  for(i=obs.length-1;i>=0;i--){var o=obs[i];o.position.z+=d;
    if(o.position.z>8){S.remove(o);obs.splice(i,1);continue}
    if(jet>0||Math.abs(o.position.x-P.position.x)>=1)continue;
    if(o.u.ramp){if(!fl&&py<.6&&Math.abs(o.position.z)<(o.u.rz||1.4)){var rm=o.u.ramp>1?3:1,H=(pv(0)?6:4)*rm,T0=(pv(0)?22:15)*rm/speed;fl=true;fg=8*H/(T0*T0);vy=fg*T0/2;py=.01;slideT=0;qEv('ramp',1)}continue}
    if(Math.abs(o.position.z)<o.u.hz+.35&&py<o.u.y1&&py+ph>o.u.y0){if(ride>0||dsh||lzS>0||pgAct.length){boom(o.position);S.remove(o);obs.splice(i,1);if(ride>0)endRide();else if(lzS>0){lzS--;if(!lzS)shM.visible=shield||dsh}else if(dsh){dsh=false;shM.visible=shield}else killPeng();continue}hit();if(state!=='play')return}}
  for(i=coins.length-1;i>=0;i--){var c=coins[i];c.position.z+=d;if(mg&&Math.abs(c.position.z)<7&&Math.abs(c.position.x-P.position.x)<4.5){c.position.x+=(P.position.x-c.position.x)*Math.min(1,dt*9);c.position.y+=(py+.9-c.position.y)*Math.min(1,dt*9)}
    if(c.position.z>8){S.remove(c);coins.splice(i,1);continue}
    if(Math.abs(c.position.x-P.position.x)<.8&&Math.abs(c.position.z)<.7&&(jet>0||c.position.y>py-.2&&c.position.y<py+ph)){
      var q=dbl?2:1;if(c.userData.r){runR+=q;if(!trial)D.r+=q;qEv('red',q)}else{runB+=q;if(!trial)D.b+=q;onBlue();if(cc()===8)az=Math.min(50,az+(pv(8)?.375:.25)*q);qEv('gem',q)}S.remove(c);coins.splice(i,1)}}
  if(time>6)updPlanes(dt);
  $('sc').textContent=Math.floor(dist/10)+runB*5+runR*50;$('ds').textContent=Math.floor(dist);$('hb').textContent=runB;$('hr').textContent=runR}

/* Камера и экраны */
function fov(){var f=50;if(state!=='menu'){var hw=(NL*LW+1.2)/2,cz=NL===5?11:6.5;f=Math.max(60,Math.min(100,2*Math.atan(hw/cz/cam.aspect)*57.3))}if(state==='chest3d')f=45;cam.fov=f+fovAdd;cam.updateProjectionMatrix()}
function resize(){var w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;fov();if(comp)comp.setSize(w,h)}
window.addEventListener('resize',resize);
function cnt(){$('mb').textContent=D.b;$('mr').textContent=D.r;$('bdg').textContent=D.ch;if($('mo'))$('mo').textContent=D.omp}
function toMenu(){state='menu';trial=false;rkClean();reset();buildPlayer();show('abil',0);show('over',0);show('hud',0);show('warn',0);show('ally',0);show('menu',1);cnt();fov()}
function start(){
  reset();state='play';
  if(!trial&&!mx&&D.sh>0){D.sh--;shield=true;shM.visible=true}
  if(!trial&&!mx&&D.x2>0){D.x2--;dbl=true}
  if(!trial&&!mx&&D.mg>0){D.mg--;mg=true}
  if(!trial&&!mx&&D.jt>0){D.jt--;jet=6}
  redPending=!trial&&!mx&&Math.random()<(pv(1)?.2:.1);save();
  show('menu',0);show('over',0);show('hud',1);show('ally',!trial&&!mx);updAlly();aura.visible=false;abilInit();fov()}

/* Сундуки */
var ODDS='<div class="row"><span>90%</span><span>100 '+gem('b')+'</span></div><div class="row"><span>9,99%</span><span>10 '+gem('r')+'</span></div><div class="row"><span>0,01%</span><span>🐰 Алый заяц (скин)</span></div>';
var chFrom='play',chBusy=false;
function showChest(from){chFrom=from;chBusy=false;$('cx').className='chest';$('crw').className='rw';$('crw').innerHTML='';
  $('cht').textContent=from==='play'?'Вы получили сундук!':'Ваш сундук';$('odds').innerHTML=ODDS;$('odds').style.display='block';
  $('cbtn').style.display='block';$('cdone').style.display='none';$('cinv').style.display=from==='play'?'inline-block':'none';show('ch',1)}
function closeChest(){show('ch',0);cnt();if(chFrom==='play')state='play';else rp()}
$('cinv').onclick=function(){D.ch++;save();closeChest()};
$('copen').onclick=function(){
  if(chBusy)return;chBusy=true;if(chFrom==='inv')D.ch--;
  var r=Math.random(),h;
  if(r<.9){D.b+=100;h='+100 '+gem('b')}else if(r<.9999||D.sk[2]){D.r+=10;h='+10 '+gem('r')}else{D.sk[2]=1;h='🐰 Алый заяц!'}
  save();cnt();$('cbtn').style.display='none';$('odds').style.display='none';$('cx').className='chest sh';
  setTimeout(function(){$('cx').className='chest op';setTimeout(function(){$('crw').innerHTML=h;$('crw').className='rw on';$('cdone').style.display='inline-block'},650)},1000)};
$('cdone').onclick=closeChest;

/* Панели и превью карт */
var TH={};
function thumb(i){var key=i+'|'+D.se+'|'+D.we;if(TH[key])return TH[key];
  var m=D.map;D.map=i;buildWorld();R.setSize(480,270,false);cam.aspect=16/9;cam.fov=62;cam.updateProjectionMatrix();cam.position.set(0,3.4,8);cam.lookAt(0,1.6,-14);
  R.render(S,cam);var c=document.createElement('canvas');c.width=480;c.height=270;c.getContext('2d').drawImage(cv,0,0,cv.width,cv.height,0,0,480,270);TH[key]=c.toDataURL('image/jpeg',.78);
  D.map=m;buildWorld();resize();return TH[key]}
var ITEMS=[{k:'pl',n:'Самолёт-помощник ✈️',d:'Кнопка в забеге: расчищает вашу полосу на 200 м. 1 шт = 1 использование',p:700},{k:'sh',n:'Щит',d:'Переживёт один удар в следующем забеге',p:300},{k:'x2',n:'Двойные алмазы',d:'×2 алмазы в следующем забеге',p:500},{k:'mg',n:'Магнит',d:'Притягивает алмазы в следующем забеге',p:400},{k:'jt',n:'Реактивный старт',d:'6 секунд полёта над препятствиями в начале забега',p:600}];
var SKP=[0,[15000,1000],0,[2500,100]];var SK=[{n:'Стандарт',e:'🏃'},{n:'Белый заяц',e:'🐰'},{n:'Алый заяц',e:'🐰'},{n:'Ангел',e:'😇'}],ptype='';
function seg(a,arr,cur){return '<div class="seg">'+arr.map(function(s,i){return '<button class="y s'+(cur===i?' on':'')+'" data-a="'+a+'" data-i="'+i+'">'+s.e+' '+s.n+'</button>'}).join('')+'</div>'}
function rp(){
  var h='';
  if(ptype==='shop'){$('pt').textContent='Магазин';ITEMS.forEach(function(it,i){h+='<div class="row"><div>'+it.n+' (есть: '+D[it.k]+')<br><span class="d">'+it.d+'</span></div><button class="y s" data-a="buy" data-i="'+i+'"'+(D.b<it.p?' disabled':'')+'>'+it.p+' '+gem('b')+'</button></div>'})}
  if(ptype==='maps'){$('pt').textContent='Карты';MAPS.forEach(function(m,i){h+='<div class="mc'+(D.map===i?' sel':'')+'"><img alt="" src="'+thumb(i)+'"><div class="mi"><div>'+m.n+'<br><span class="d">'+m.nl+' полос · '+m.t+'</span></div><button class="y s" data-a="map" data-i="'+i+'"'+(D.map===i?' disabled':'')+'>'+(D.map===i?'Выбрано':'Выбрать')+'</button></div></div>'})}
  if(ptype==='skinsX'){$('pt').textContent='Скины';SK.forEach(function(s,i){
    h+='<div class="row"><div>'+s.e+' '+s.n+'<br><span class="d">'+['Классический бегун','Костюм белого зайца','Только из сундука','Крылья и нимб'][i]+'</span></div><div>';
    if(D.sk[i])h+='<button class="y s" data-a="skin" data-i="'+i+'"'+(D.sel===i?' disabled':'')+'>'+(D.sel===i?'Выбрано':'Выбрать')+'</button>';
    else if(SKP[i])h+='<button class="y s" data-a="skin" data-i="'+i+'" data-c="b"'+(D.b<SKP[i][0]?' disabled':'')+'>'+SKP[i][0]+' '+gem('b')+'</button><button class="y s" data-a="skin" data-i="'+i+'" data-c="r"'+(D.r<SKP[i][1]?' disabled':'')+'>'+SKP[i][1]+' '+gem('r')+'</button>';
    else h+='<span class="d">шанс 0,01%</span>';
    h+='</div></div>'})}
  if(ptype==='skins')h=skinsHTML();if(ptype==='chars')h=charsHTML();if(ptype==='ranked')h=rankedHTML();if(ptype==='event')h=evHTML();if(ptype==='glory')h=gloryHTML();if(ptype==='quests')h=questsHTML();if(ptype==='inv'){$('pt').textContent='Сундуки';h='<p>Сундуков в инвентаре: <b>'+D.ch+'</b></p><p class="d">Сундук даётся за каждые 1000 м. Шансы:</p>'+ODDS+'<button class="y m" data-a="chopen"'+(D.ch?'':' disabled')+'>Открыть сундук</button>'}
  if(ptype==='world'){$('pt').textContent='Мир';h='<p class="d">Время года</p>'+seg('se',SEA,D.se)+'<p class="d">Погода</p>'+seg('we',WE,D.we)+'<p class="d">Графика</p>'+seg('fx',[{n:'Обычная',e:'🙂'},{n:'Максимум',e:'✨'}],D.fx)}
  $('pb').innerHTML=h;cnt()}
function openP(t){ptype=t;show('pn',1);$('pb').innerHTML='<p>Загрузка…</p>';setTimeout(function(){try{rp()}catch(e){$('pb').innerHTML='<p>Ошибка: '+String(e.message||e)+'</p>'}},30)}
$('bs').onclick=function(){openP('shop')};$('bm').onclick=function(){openP('maps')};$('bk').onclick=function(){openP('skins')};$('bc').onclick=function(){openP('inv')};$('bw').onclick=function(){openP('world')};
$('px').onclick=function(){show('pn',0)};
$('pb').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||t.disabled)return;var a=t.dataset.a,i=+t.dataset.i,c=t.dataset.c;
  if(a==='buy'&&D.b>=ITEMS[i].p){D.b-=ITEMS[i].p;D[ITEMS[i].k]++}
  if(a==='map'){D.map=i;buildWorld();reset()}
  if(a==='se'){D.se=i;buildWorld()}if(a==='we'){D.we=i;buildWorld()}
  if(a==='skin'){if(D.sk[i])D.sel=i;else{var pr=SKP[i][c==='r'?1:0];if(D[c]>=pr){D[c]-=pr;D.sk[i]=1;D.sel=i}}buildPlayer()}
  if(a==='chopen'&&D.ch>0){show('pn',0);showChest('inv');return}
  save();rp()});
$('play').onclick=start;$('retry').onclick=start;$('tomenu').onclick=toMenu;

/* Управление */
function act(a){
  if(state!=='play')return;
  if(a==='L'&&lane>0)lane--;else if(a==='R'&&lane<NL-1)lane++;
  else if(a==='U'&&(py===0||onTr)){vy=10;py+=.01;slideT=0}
  else if(a==='D'){if(py>0){if(!fl)vy=-16}else if(ride<=0)slideT=.7}}
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')act('L');else if(k==='arrowright'||k==='d')act('R');
  else if(k==='arrowup'||k==='w'||k===' ')act('U');else if(k==='arrowdown'||k==='s')act('D');else if(k==='e')useAlly();else if(k==='q')abilUse();
  else if(k==='enter'&&(state==='menu'||state==='over')&&$('pn').style.display!=='flex')start()});
var sx=0,sy=0,sw0=false;
window.addEventListener('pointerdown',function(e){if(state!=='play')return;sx=e.clientX;sy=e.clientY;sw0=true});
window.addEventListener('pointermove',function(e){
  if(!sw0)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;sw0=false;
  if(Math.abs(dx)>Math.abs(dy))act(dx<0?'L':'R');else act(dy<0?'U':'D')});
window.addEventListener('pointerup',function(){sw0=false});

/* Цикл */
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(now-last)/1000);last=now;if(slowT>0){slowT-=dt;dt*=.4}
  if(state==='play')step(dt);
  else if(state==='menu'){time+=dt;scroll(2*dt);P.position.y=Math.sin(time*2)*.03;P.rotation.y=Math.PI+Math.sin(time*.9)*.45;lL.rotation.x=lR.rotation.x=0;aL.rotation.x=Math.sin(time*2)*.08;aR.rotation.x=-aL.rotation.x}
  coins.forEach(function(c){c.rotation.y+=dt*3});
  deco.forEach(function(o){if(o.userData.bl)o.userData.bl.rotation.z+=dt});
  wx(dt);
  if(state==='chest3d'){cam.position.set(0,3.2,8.6);cam.lookAt(0,2.2,0)}else if(state==='menu'){cam.position.set(0,1.7,6.6);cam.lookAt(0,1.55,0)}
  else{var cy=Math.max(0,py-3)*.5;cam.position.set(P.position.x*.6,(NL===5?6:4.3)+cy,NL===5?11:6.5);cam.lookAt(P.position.x*.3,1.2+cy,-6)}
  skyUpd(dt);animX();if(comp&&D.fx)comp.render(dt);else R.render(S,cam)}
resize();buildWorld();buildPlayer();toMenu();requestAnimationFrame(loop);cloudInit();
})();
</script>
